<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registation Form</title>
    <link rel="stylesheet" href="regestration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>
<body>

    <main class="container">
        <div class="header">
            <h2>REGISTRATION FORM</h2>
        </div>
        <form id="form" class="form">
            <div class="form-control">
                <label for="">Username</label>
                <input type="text" name="" id="username" placeholder="Enter your FullName" autocomplete="off">
                <i class="fa-solid fa-circle-check"></i>
                <i class="fa-solid fa-circle-exclamation"></i>
                <small>error msg</small>
            </div>
            <div class="form-control">
                <label for="email">Email</label>
                <input type="text" name="" id="email" placeholder="Enter your Email Id" autocomplete="off">
                <i class="fa-solid fa-circle-check"></i>
                <i class="fa-solid fa-circle-exclamation"></i>
                <small>error msg</small>
            </div><div class="form-control">
                <label for="">Phone Number</label>
                <input type="text" name="" id="phoneNumber" placeholder="Enter your Phone Number" autocomplete="off">
                <i class="fa-solid fa-circle-check"></i>
                <i class="fa-solid fa-circle-exclamation"></i>
                <small>error msg</small>
            </div><div class="form-control">
                <label for="">Password</label>
                <input type="text" name="" id="password" placeholder="Enter your Password" autocomplete="off">
                <i class="fa-solid fa-circle-check"></i>
                <i class="fa-solid fa-circle-exclamation"></i>
                <small>error msg</small>
            </div>
            <div class="form-control">
                <label for="">Confirm Password</label>
                <input type="text" name="" id="confirmPassword" placeholder="Enter your Password Again" autocomplete="off">
                <i class="fa-solid fa-circle-check"></i>
                <i class="fa-solid fa-circle-exclamation"></i>
                <small>error msg</small>
            </div>

            <input type="submit" name="submit" class="btn">

        </form>
            
    </main> 
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="regestration.js"></script>
</body>
</html>
